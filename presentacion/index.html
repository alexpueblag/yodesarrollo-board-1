<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Presentación</title><link rel="stylesheet" href="simple.css?v=simple-1"></head><body>
<div id="simpleLoading" role="status">Preparando la presentación… <button id="simpleRetry" hidden>Reintentar</button></div>
<main id="simple" hidden>
<header id="simpleHeader"><strong id="simpleBrand"></strong><div class="s-actions"><button id="simplePlay" type="button" aria-pressed="false"><span aria-hidden="true">▶</span></button><button id="simpleDetails" type="button"></button><button id="simpleShare" type="button"><span aria-hidden="true">↗</span></button></div></header>
<div id="simpleTrack"><section id="simpleStage" aria-labelledby="simpleTitle">
<div class="s-intro"><p id="simpleCount"></p><h1 id="simpleTitle"></h1><p id="simpleLead"></p></div>
<div id="simpleArt"><div id="simpleDiagram" aria-hidden="true"></div><div id="simpleLabels"></div></div>
<div class="s-caption"><span id="simpleCaptionTitle" class="s-accessible"></span><p id="simpleCaptionBody"></p><div id="simpleSteps" aria-hidden="true"><i></i><i></i><i></i></div></div>
<nav id="simpleControls"><button id="simplePrev" type="button">←</button><button id="simpleReplay" type="button">↺</button><button id="simpleNext" type="button"></button><div id="simpleContact" hidden></div></nav>
</section></div>
</main>
<dialog id="simpleReader"><div class="s-dialog-head"><h2 id="simpleReaderTitle"></h2><button id="simpleReaderClose" type="button">×</button></div><div id="simpleReaderArticles"></div><div id="simpleFootnotes"></div><button id="simpleArchive" type="button"></button></dialog>
<dialog id="simpleArchiveDialog"><div class="s-dialog-head"><h2 id="simpleArchiveTitle"></h2><button id="simpleArchiveClose" type="button">×</button></div><iframe id="simpleArchiveFrame" title="Versión anterior" loading="lazy"></iframe></dialog>
<dialog id="simpleMessageDialog"><div class="s-dialog-head"><h2 id="simpleMessageTitle"></h2><button id="simpleMessageClose" type="button">×</button></div><textarea id="simpleMessage" readonly rows="7"></textarea><button id="simpleCopy" type="button"></button><p id="simpleCopyStatus" role="status"></p></dialog>
<script src="source.js?v=public-source2"></script><script src="simple-diagrams.js?v=simple-1"></script><script src="simple.js?v=simple-1"></script></body></html>
