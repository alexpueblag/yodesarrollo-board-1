name: Trazado público de la apertura
on:
  pull_request:
    paths: ['scripts/prepare-hunt-map.cjs', '.github/workflows/hunt-map.yml']
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtener vialidades públicas sin escrituras de negocio
        run: node scripts/prepare-hunt-map.cjs
