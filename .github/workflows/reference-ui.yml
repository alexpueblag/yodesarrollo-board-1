name: Reference UI inspection
on:
  pull_request:
    paths:
      - tests/reference-ui.cjs
      - .github/workflows/reference-ui.yml
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/reference-ui.cjs
